# Web Server Port
server.port=8080

# Application Details
spring.application.name=restaurant-event-management
spring.main.allow-bean-definition-overriding=true

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_event_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Static Frontend Assets Location
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
spring.mvc.static-path-pattern=/**

# Jackson JSON Serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=9a6747f3b89ef784860b73c4d7e97426d40be6d11f7c70c0c7a4bf0b3e512fd5
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

